  <body>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ملابس الجو البارد والممطر</title>
<style>
  :root{--purple:#6c5ce7;--green:#4caf50;--red:#ff7675;--ink:#3a3a4a;--sub:#7c7c92;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%);
    font-family:"Tahoma","Segoe UI",Arial,sans-serif;direction:rtl;color:var(--ink);display:flex;justify-content:center;}
  .app{width:100%;max-width:500px;min-height:100vh;display:flex;flex-direction:column;padding:14px 16px 24px;}
  .sound-toggle{position:fixed;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;}
  .sound-toggle:active{transform:scale(.9);}
  header{text-align:center;padding-top:8px;margin-bottom:10px;}
  header h1{font-size:20px;margin:0 0 4px;font-weight:800;}
  header p{font-size:13px;margin:0;color:var(--sub);}
  body.in-game header{display:none;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .level-list{display:flex;flex-direction:column;gap:14px;margin-top:8px;}
  .level-card{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px;display:flex;
    align-items:center;gap:14px;cursor:pointer;border:5px solid transparent;}
  .level-card:active{transform:scale(.98);}
  .level-card .icon{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#f4f1ff;border-radius:16px;flex-shrink:0;}
  .level-card .txt{flex:1;text-align:right;}
  .level-card .txt h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .level-card .txt p{margin:0;font-size:13px;color:var(--sub);}
  .dots-mini{display:flex;gap:4px;margin-top:8px;}
  .dots-mini span{width:7px;height:7px;border-radius:50%;background:#e6e6ee;}
  .dots-mini span.done{background:var(--green);}

  /* شريط أعلى الصفحة: السهم وبجانبه نقاط التكرار */
  .game-top{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding-left:52px;}
  .back-btn{border:none;background:#fff;border-radius:50%;width:40px;height:40px;box-shadow:0 3px 8px rgba(0,0,0,.12);font-size:18px;cursor:pointer;flex-shrink:0;}
  .progress{display:flex;gap:9px;}
  .progress span{width:13px;height:13px;border-radius:50%;background:#e6e6ee;transition:transform .2s,background .2s;}
  .progress span.current{background:var(--purple);box-shadow:0 0 0 4px rgba(108,92,231,.25);}
  .progress span.done{background:var(--green);transform:scale(1.15);}

  .prompt-box{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .prompt-box p{flex:1;margin:0;font-size:19px;font-weight:700;line-height:1.6;text-align:right;}
  .speak-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--purple);color:#fff;font-size:17px;flex-shrink:0;cursor:pointer;}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(108,92,231,.5);}to{box-shadow:0 0 0 10px rgba(108,92,231,0);}}

  /* الصور تحت بعض وبنفس حجم النشاط المرجعي */
  .cards-wrap{display:flex;flex-direction:column;gap:12px;width:100%;}
  .card{position:relative;width:100%;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);
    border:5px solid transparent;overflow:hidden;cursor:pointer;flex-shrink:0;transition:transform .15s,border-color .2s;}
  .card:active{transform:scale(.98);}
  .card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;image-rendering:-webkit-optimize-contrast;}
  #gameArea.lvl-2 .card img{aspect-ratio:16/9;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red);animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .badge{position:absolute;top:8px;left:8px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:22px;font-weight:900;opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s;}
  .badge.show{opacity:1;transform:scale(1);}
  .xmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;}
  .xmark.show{opacity:1;}
  .xmark span{font-size:72px;}
  #gameArea.lvl-2 .prompt-box{padding:10px 14px;margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  .game-area{transition:opacity .25s;}
  .game-area.fading{opacity:0;}

  .summary-card{background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:28px 20px;text-align:center;margin-top:12px;}
  .summary-card h2{font-size:24px;margin:0 0 6px;}
  .summary-card .score{font-size:34px;font-weight:900;color:var(--purple);margin:10px 0;}
  .stars{font-size:30px;letter-spacing:4px;margin-bottom:14px;}
  .summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .summary-actions button{border:none;padding:11px 18px;border-radius:28px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--purple);color:#fff;}
  .btn-secondary{background:#f0f0f6;color:var(--ink);}
</style>

<div class="app">
  <button class="sound-toggle" id="soundToggle" aria-label="صوت">🔊</button>
  <header>
    <h1>ماذا نرتدي في الجو البارد والممطر؟</h1>
    <p>لعبة اختيار الملابس المناسبة</p>
  </header>

  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">☔</div>
        <div class="txt"><h3>المستوى الأول</h3><p>اختر بين صورتين</p><div class="dots-mini" id="miniDots1"></div></div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt"><h3>المستوى الثاني</h3><p>اختر بين ثلاث صور</p><div class="dots-mini" id="miniDots2"></div></div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="game-top">
      <button class="back-btn" id="backBtn" aria-label="رجوع">➡</button>
      <div class="progress" id="progressDots"></div>
    </div>
    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn" aria-label="استمع للسؤال">🔊</button>
        <p>مَاذَا نَرْتَدِي عِنْدَمَا يَكُونُ الجَوُّ بَارِدًا وَمُمْطِرًا؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore"></div>
      <div class="stars" id="summaryStars"></div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

  };
  var CORRECT = "raincoat";
  var LEVELS = { 1: ["raincoat","coatSunny"], 2: ["raincoat","tshirtRain","pajamas"] };

  var $ = function(id){ return document.getElementById(id); };
  var aQ = $("audioQuestion"), aOK = $("audioCorrect"), aNO = $("audioWrong");
  var allAudio = [aQ, aOK, aNO];
  var soundOn = true, unlocked = false;
  var level = 1, rep = 0, busy = false, firstTry = true, score = 0, lastOrder = "";
  var progress = {1:0, 2:0};
  var timers = [];

  function later(fn, ms){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function stopAll(){ allAudio.forEach(function(a){ a.pause(); a.currentTime = 0; }); $("speakBtn").classList.remove("speaking"); }

  function unlockAudio(){
    if (unlocked) return; unlocked = true;
    allAudio.forEach(function(a){ a.muted = true; var p = a.play(); if (p && p.then) p.then(function(){ a.pause(); a.currentTime = 0; a.muted = false; }).catch(function(){ a.muted = false; }); else { a.pause(); a.muted = false; } });
  }

  // تشغيل مقطع واحد فقط في كل مرة (بدون تداخل) والانتظار حتى ينتهي
  function play(a){
    return new Promise(function(resolve){
      stopAll();
      if (!soundOn){ resolve(); return; }
      a.muted = false; a.volume = 1; a.currentTime = 0;
      var done = false;
      function fin(){ if (done) return; done = true; a.removeEventListener("ended", fin); resolve(); }
      a.addEventListener("ended", fin);
      var dur = (isFinite(a.duration) && a.duration > 0) ? a.duration : 5;
      later(fin, dur * 1000 + 600);
      var p = a.play(); if (p && p.catch) p.catch(fin);
    });
  }

  function show(id){
    ["screen-levels","screen-game","screen-summary"].forEach(function(s){ $(s).classList.toggle("active", s === id); });
    document.body.classList.toggle("in-game", id !== "screen-levels");
    window.scrollTo(0,0);
  }

  function renderMini(){
    [1,2].forEach(function(l){
      var h = ""; for (var i=0;i<REPS;i++) h += '<span class="'+(i<progress[l]?"done":"")+'"></span>';
      $("miniDots"+l).innerHTML = h;
    });
  }

  function renderDots(){
    var h = "";
    for (var i=0;i<REPS;i++) h += '<span class="'+(i<rep?"done":(i===rep?"current":""))+'"></span>';
    $("progressDots").innerHTML = h;
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function askQuestion(){
    $("speakBtn").classList.add("speaking");
    play(aQ).then(function(){ $("speakBtn").classList.remove("speaking"); });
  }

  function renderRep(){
    firstTry = true; busy = false;
    var order, key, tries = 0;
    do { order = shuffle(LEVELS[level]); key = order.join(","); tries++; } while (key === lastOrder && tries < 10);
    lastOrder = key;
    var wrap = $("cardsWrap"); wrap.innerHTML = "";
    order.forEach(function(name){
      var c = document.createElement("div");
      c.className = "card"; c.dataset.name = name;
      c.innerHTML = '<img alt="" src="'+IMGS[name]+'"><div class="badge">✓</div><div class="xmark"><span>❌</span></div>';
      c.addEventListener("click", function(){ onPick(c); });
      wrap.appendChild(c);
    });
    renderDots();
    askQuestion();
  }

  function onPick(card){
    if (busy) return;
    busy = true;
    if (card.dataset.name === CORRECT){
      if (firstTry) score++;
      card.classList.add("correct");
      card.querySelector(".badge").classList.add("show");
      Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){ c.classList.add("locked"); });
      rep++; renderDots();
      play(aOK).then(function(){
        later(function(){
          $("gameArea").classList.add("fading");
          later(function(){
            $("gameArea").classList.remove("fading");
            if (rep >= REPS) finishLevel(); else renderRep();
          }, 250);
        }, GAP_AFTER_CORRECT);
      });
    } else {
      firstTry = false;
      var x = card.querySelector(".xmark");
      card.classList.add("wrong-flash"); x.classList.add("show");
      var audioDone = false, xDone = false;
      function release(){ if (audioDone && xDone) busy = false; }
      play(aNO).then(function(){ audioDone = true; release(); });
      later(function(){ x.classList.remove("show"); card.classList.remove("wrong-flash"); xDone = true; release(); }, X_DURATION);
    }
  }

  function startLevel(l){
    clearTimers(); stopAll();
    level = l; rep = 0; score = 0; lastOrder = "";
    $("gameArea").className = "game-area lvl-" + l;
    show("screen-game");
    renderRep();
  }

  function finishLevel(){
    progress[level] = REPS; renderMini();
    $("summaryScore").textContent = score + " / " + REPS;
    $("summaryStars").textContent = score >= 5 ? "⭐⭐⭐" : (score >= 3 ? "⭐⭐" : "⭐");
    $("nextActionBtn").textContent = level === 1 ? "المستوى التالي" : "المستويات";
    show("screen-summary");
  }

  Array.prototype.forEach.call(document.querySelectorAll(".level-card"), function(c){
    c.addEventListener("click", function(){ unlockAudio(); startLevel(parseInt(c.dataset.level,10)); });
  });
  $("backBtn").addEventListener("click", function(){ clearTimers(); stopAll(); progress[level] = Math.max(progress[level], rep); renderMini(); show("screen-levels"); });
  $("speakBtn").addEventListener("click", function(){ if (!busy) askQuestion(); });
  $("restartLevelBtn").addEventListener("click", function(){ startLevel(level); });
  $("nextActionBtn").addEventListener("click", function(){ if (level === 1) startLevel(2); else { stopAll(); show("screen-levels"); } });
  $("soundToggle").addEventListener("click", function(){
    soundOn = !soundOn; this.textContent = soundOn ? "🔊" : "🔇"; if (!soundOn) stopAll();
  });

  renderMini();
})();
</script>
